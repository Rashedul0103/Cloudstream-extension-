name: Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [main]
    paths:
      - 'MultiStremio/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run regression tests and build plugin
        run: |
          cd src
          gradle testDebugUnitTest make makePluginsJson

      - name: Verify this is still the latest main commit
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          REMOTE_SHA="$(git -C src ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "Skipping publish: a newer commit is already on ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Publish to builds branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir builds && cd builds
          git init -q -b builds
          cp ../src/MultiStremio/build/*.cs3 .
          cp ../src/build/plugins.json .
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -q -m "Build $GITHUB_SHA"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds
